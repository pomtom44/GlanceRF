<!--
  This HTML is injected into each grid cell that uses this module.
  The cell div already has classes "grid-cell grid-cell-{id}" (e.g. grid-cell-live_spots)
  added by the core. Put only the inner content here.

  Use classes with your module id + underscore prefix (e.g. live_spots_*)
  so they don't clash with core or other modules.
-->
<div class="live_spots_wrap">
  <div class="live_spots_filter_note"></div>
  <div class="live_spots_loading" style="display:none;">Loading...</div>
  <div class="live_spots_error" style="display:none;"></div>
  <div class="live_spots_empty" style="display:none;">Set callsign or grid in config</div>
  <div class="live_spots_list_wrap" style="display:none;">
    <ul class="live_spots_list"></ul>
  </div>
  <div class="live_spots_table_wrap" style="display:none;">
    <div class="live_spots_bands_grid"></div>
  </div>
  <div class="live_spots_last_refresh"></div>
</div>
